twist_mux:
  ros__parameters:
    topics:
      navigation:
        topic: cmd_vel_nav
        timeout: 0.5
        priority: 10
      keyboard_teleop:
        topic: cmd_vel_keyboard
        timeout: 0.5
        priority: 50
      joystick_teleop:
        topic: cmd_vel_teleop
        timeout: 0.5
        priority: 100  # Higher priority than keyboard